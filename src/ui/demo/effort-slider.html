<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>推理强度滑块 Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #1c1d20; color: #ddd;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage { width: min(560px, 92vw); padding-top: 150px; }

  .composer { background: #2a2a2e; border: 1px solid #38383d; border-radius: 22px; padding: 16px 14px 12px; }
  .composer textarea {
    width: 100%; border: 0; outline: 0; resize: none; background: transparent;
    font: inherit; font-size: 15px; color: #e6e6e6; height: 48px;
  }
  .composer textarea::placeholder { color: #75757c; }
  .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; position: relative; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 14px;
    border: 0; border-radius: 999px; background: #38383e; color: #b9b9c0; font: inherit; font-size: 14px;
    cursor: pointer; transition: background .15s;
  }
  .pill:hover { background: #424249; }
  .pill .lvl { color: var(--accent); font-weight: 600; }
  .pill svg { transition: transform .2s; }
  .pill[aria-expanded="true"] svg { transform: rotate(180deg); }

  .send {
    width: 34px; height: 34px; border: 0; border-radius: 50%; background: #8b8b92; color: #2a2a2e;
    display: grid; place-items: center; cursor: pointer;
  }

  /* 弹层 */
  .pop {
    position: absolute; right: -6px; bottom: calc(100% + 12px); width: 280px;
    background: #2f2f34; border: 1px solid #3e3e45; border-radius: 18px; padding: 14px 14px 18px;
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(6px) scale(.98); transform-origin: bottom right;
    pointer-events: none; transition: opacity .16s, transform .16s;
  }
  .pop.open { opacity: 1; transform: none; pointer-events: auto; }

  .head { text-align: center; margin-bottom: 14px; }
  .level { font-size: 17px; font-weight: 600; color: var(--accent); transition: color .2s; }
  .model {
    margin-top: 3px; display: inline-flex; align-items: center; gap: 2px; padding: 0;
    border: 0; background: none; font: inherit; font-size: 13px; color: #a9a9b0; cursor: pointer;
  }
  .model:hover { color: #d6d6dc; }
  .reset {
    position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border: 0; border-radius: 8px;
    background: none; color: #9a9aa2; display: grid; place-items: center; cursor: pointer;
    transition: opacity .15s, background .15s;
  }
  .reset:hover:not(:disabled) { background: #3a3a41; color: #e0e0e6; }
  .reset:disabled { opacity: .35; cursor: default; }

  /* 滑块 */
  .slider {
    --p: 0; --thumb: 34px; --h: 30px;
    position: relative; height: var(--thumb); cursor: pointer; touch-action: none; outline: none;
  }
  .track {
    position: absolute; left: 0; right: 0; top: 50%; height: var(--h); transform: translateY(-50%);
    border-radius: 999px; background: #3d3d44; overflow: hidden;
  }
  .dots { position: absolute; inset: 0; pointer-events: none; transition: opacity .2s; }
  .galaxy .dots { opacity: 0; }
  .dot {
    position: absolute; top: 50%; width: 5px; height: 5px; border-radius: 50%;
    left: calc(var(--thumb) / 2 + (100% - var(--thumb)) * var(--k));
    transform: translate(-50%, -50%); background: rgba(255,255,255,.22);
  }
  .dot.on { background: rgba(255,255,255,.6); }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: calc(var(--thumb) + (100% - var(--thumb)) * var(--p));
    border-radius: 999px; overflow: hidden;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
  }
  /* 流光与星点只在 Max / Ultra 档启用 */
  .fill::after {
    content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .25s;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
    background-size: 220% 100%;
  }
  .galaxy .fill::after { opacity: 1; animation: sweep 3.2s linear infinite; }
  .ultra .fill::after { animation-duration: 2.2s; }
  @keyframes sweep { from { background-position: 160% 0; } to { background-position: -60% 0; } }

  .stars { position: absolute; left: 0; top: 0; bottom: 0; opacity: 0; transition: opacity .25s; }
  .galaxy .stars { opacity: 1; }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    box-shadow: 0 0 4px 1px rgba(255,255,255,.7);
  }
  .galaxy .star { animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--delay); }
  .star.extra { display: none; }
  .ultra .star.extra { display: block; }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.6); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  .thumb {
    position: absolute; top: 0; width: var(--thumb); height: var(--thumb);
    left: calc((100% - var(--thumb)) * var(--p));
    border-radius: 50%; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.06);
    transition: transform .12s;
  }
  .slider.dragging .thumb, .slider:active .thumb { transform: scale(1.08); }
  .slider:focus-visible .thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent), 0 1px 4px rgba(0,0,0,.25); }

  .slider.anim .fill { transition: width .22s cubic-bezier(.3,.7,.2,1); }
  .slider.anim .thumb { transition: left .22s cubic-bezier(.3,.7,.2,1), transform .12s; }

  .hint { margin-top: 18px; color: #80808a; font-size: 13px; text-align: center; }
  .hint code { color: #c8c8d0; }
</style>
</head>
<body>
<div class="stage">
  <div class="composer">
    <textarea placeholder="给 Agent 发送消息…"></textarea>
    <div class="toolbar">
      <div class="pop" id="pop" role="dialog" aria-label="推理强度">
        <button class="reset" id="reset" type="button" aria-label="恢复默认" title="恢复默认">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        </button>
        <div class="head">
          <div class="level" id="level"></div>
          <button class="model" type="button">MiniMax-M3.1-Flash
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
        <div class="slider" id="slider" role="slider" tabindex="0" aria-label="推理强度">
          <div class="track">
            <div class="fill"><div class="stars" id="stars"></div></div>
            <div class="dots" id="dots"></div>
          </div>
          <div class="thumb"></div>
        </div>
      </div>

      <button class="pill" id="pill" aria-haspopup="dialog" aria-expanded="false">
        推理强度 <span class="lvl" id="pillLvl"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="send" aria-label="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
  </div>
  <div class="hint">请求参数 <code id="effort"></code> · 拖动、点击轨道或用方向键调整</div>
</div>

<script>
  // Ultra 暂无对应接口档位（最高为 max），先按 max 发送
  const LEVELS = [
    { label: '低', effort: 'low' },
    { label: '中', effort: 'medium' },
    { label: '高', effort: 'high' },
    { label: '极高', effort: 'xhigh' },
    { label: 'Max', effort: 'max', fx: 'max' },
    { label: 'Ultra', effort: 'max', fx: 'ultra' },
  ];
  const LAST = LEVELS.length - 1;
  const DEFAULT = 2;
  const THEMES = {
    normal: { c1: '#1f78ff', c2: '#2b86ff', c3: '#3a94ff', accent: '#3d9bff' },
    max: { c1: 'hsl(232 62% 46%)', c2: 'hsl(262 60% 56%)', c3: 'hsl(278 62% 72%)', accent: '#a47cff' },
    ultra: { c1: 'hsl(228 70% 44%)', c2: 'hsl(268 72% 58%)', c3: 'hsl(290 78% 78%)', accent: '#b98cff' },
  };

  const pill = document.getElementById('pill');
  const pop = document.getElementById('pop');
  const slider = document.getElementById('slider');
  const levelEl = document.getElementById('level');
  const pillLvl = document.getElementById('pillLvl');
  const effortEl = document.getElementById('effort');
  const resetBtn = document.getElementById('reset');
  const dotsEl = document.getElementById('dots');
  const starsEl = document.getElementById('stars');

  slider.setAttribute('aria-valuemin', 0);
  slider.setAttribute('aria-valuemax', LAST);
  const dots = LEVELS.map((_, k) => {
    const d = document.createElement('i');
    d.className = 'dot';
    d.style.setProperty('--k', k / LAST);
    return dotsEl.appendChild(d);
  });

  // 星点按整条轨道宽度分布，只在已填充区域内可见
  for (let i = 0; i < 42; i++) {
    const s = document.createElement('i');
    const size = 1 + Math.random() * 2.2;
    s.className = i % 2 ? 'star extra' : 'star';
    s.style.cssText = `left:${Math.random() * 100}%;top:${10 + Math.random() * 80}%;width:${size}px;height:${size}px;` +
      `--d:${1.6 + Math.random() * 2.4}s;--delay:${-Math.random() * 4}s`;
    starsEl.appendChild(s);
  }

  const track = slider.querySelector('.track');
  new ResizeObserver(() => { starsEl.style.width = track.clientWidth + 'px'; }).observe(track);

  let p = 0;
  let value = -1;

  const toValue = (pp) => Math.round(pp * LAST);
  const toP = (v) => v / LAST;

  function render() {
    const v = toValue(p);
    if (v === value) return;
    value = v;
    const lv = LEVELS[v];
    const theme = THEMES[lv.fx || 'normal'];
    for (const k of ['c1', 'c2', 'c3']) slider.style.setProperty('--' + k, theme[k]);
    slider.classList.toggle('galaxy', !!lv.fx);
    slider.classList.toggle('ultra', lv.fx === 'ultra');
    for (const el of [pop, pill]) el.style.setProperty('--accent', theme.accent);
    levelEl.textContent = lv.label;
    pillLvl.textContent = lv.label;
    effortEl.textContent = `effort: "${lv.effort}"`;
    resetBtn.disabled = v === DEFAULT;
    slider.setAttribute('aria-valuenow', v);
    slider.setAttribute('aria-valuetext', lv.label);
    dots.forEach((d, k) => d.classList.toggle('on', k < v));
  }

  function setP(next, animate) {
    p = Math.min(1, Math.max(0, next));
    slider.classList.toggle('anim', !!animate);
    slider.style.setProperty('--p', p);
    render();
  }

  function pFromEvent(e) {
    const rect = slider.getBoundingClientRect();
    const thumb = parseFloat(getComputedStyle(slider).getPropertyValue('--thumb'));
    return (e.clientX - rect.left - thumb / 2) / (rect.width - thumb);
  }

  let dragging = false;
  slider.addEventListener('pointerdown', (e) => {
    dragging = true;
    slider.setPointerCapture(e.pointerId);
    slider.classList.add('dragging');
    setP(pFromEvent(e), true);
  });
  slider.addEventListener('pointermove', (e) => {
    if (dragging) setP(pFromEvent(e), false);
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    slider.classList.remove('dragging');
    setP(toP(toValue(p)), true);
  };
  slider.addEventListener('pointerup', endDrag);
  slider.addEventListener('pointercancel', endDrag);

  slider.addEventListener('keydown', (e) => {
    const map = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 };
    let v = value;
    if (e.key in map) v += map[e.key];
    else if (e.key === 'Home') v = 0;
    else if (e.key === 'End') v = LAST;
    else return;
    e.preventDefault();
    setP(toP(Math.min(LAST, Math.max(0, v))), true);
  });

  resetBtn.addEventListener('click', () => {
    setP(toP(DEFAULT), true);
    slider.focus({ preventScroll: true });
  });

  function setOpen(open) {
    pop.classList.toggle('open', open);
    pill.setAttribute('aria-expanded', open);
    if (open) slider.focus({ preventScroll: true });
  }
  pill.addEventListener('click', (e) => {
    e.stopPropagation();
    setOpen(!pop.classList.contains('open'));
  });
  document.addEventListener('pointerdown', (e) => {
    if (!pop.contains(e.target) && !pill.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { setOpen(false); pill.focus(); }
  });

  setP(toP(DEFAULT), false);
  setOpen(true);
</script>
</body>
</html>
